<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCESQ Natural Fault Review v2</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f2f5; color: #222; }
.topbar { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #ddd; padding: 12px 24px; display: flex; align-items: center; gap: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.topbar input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; width: 180px; }
.topbar .stats { font-size: 14px; color: #666; }
.topbar button { padding: 8px 16px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
.btn-export { background: #007bff; color: #fff; }
.btn-export:hover { background: #0056b3; }
.btn-import { background: #6c757d; color: #fff; margin-left: 4px; }
.btn-nav { background: #e9ecef; color: #333; }
.btn-nav:hover { background: #dee2e6; }
.btn-nav:disabled { opacity: 0.4; cursor: default; }

.container { max-width: 780px; margin: 24px auto; padding: 0 16px; }

.case-card { background: #fff; border-radius: 10px; padding: 28px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }

.case-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.case-num { font-size: 20px; font-weight: 700; color: #333; }
.badge { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 4px 10px; border-radius: 20px; letter-spacing: .5px; }
.badge-conflicting { background: #ffe0e0; color: #b00; }
.badge-missing { background: #fff3cd; color: #856404; }

.meta { font-size: 13px; color: #777; margin-bottom: 16px; }
.meta b { color: #444; }

.summary-box { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; }
.summary-box .title { font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
.summary-box .text { font-size: 14px; line-height: 1.6; color: #333; }

.evidence { margin-bottom: 16px; }
.evidence details { margin-bottom: 8px; }
.evidence summary { font-size: 13px; font-weight: 600; color: #555; cursor: pointer; padding: 4px 0; }
.evidence pre { font-size: 11px; background: #fafafa; border: 1px solid #eee; border-radius: 4px; padding: 8px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; margin-top: 4px; }

.llm-box { background: #eef6ff; border: 1px solid #cce0ff; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; }
.llm-box .llm-judgment { font-size: 14px; font-weight: 600; }
.llm-box .llm-notes { font-size: 13px; color: #555; margin-top: 4px; }

.judge-section { border-top: 1px solid #eee; padding-top: 16px; }
.judge-section .prompt { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.judge-options { display: flex; gap: 12px; flex-wrap: wrap; }
.judge-btn { flex: 1; min-width: 140px; padding: 14px 16px; border: 2px solid #ddd; border-radius: 8px; background: #fff; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; transition: all .15s; }
.judge-btn:hover { border-color: #aaa; }
.judge-btn.selected-agree { border-color: #28a745; background: #d4edda; }
.judge-btn.selected-disagree { border-color: #dc3545; background: #f8d7da; }
.judge-btn.selected-unsure { border-color: #ffc107; background: #fff3cd; }
.judge-notes { width: 100%; margin-top: 12px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; resize: vertical; min-height: 50px; }

.keyboard-hint { font-size: 11px; color: #aaa; margin-top: 8px; }

.hidden { display: none; }
</style>
</head>
<body>

<div class="topbar">
  <span style="font-weight:700;font-size:16px;">OCESQ Natural Fault Review</span>
  <input type="text" id="annotator" placeholder="Your name" onchange="save()">
  <span class="stats">Case <b id="cur"></b> / <b id="tot"></b> &nbsp;|&nbsp; Done: <b id="done">0</b></span>
  <button class="btn-export" onclick="exportCSV()">Export CSV</button>
  <button class="btn-import" onclick="document.getElementById('import-file').click()">Import CSV</button>
  <input type="file" id="import-file" class="hidden" accept=".csv" onchange="importCSV(event)">
  <button class="btn-nav" id="btn-prev" onclick="navigate(-1)">Previous</button>
  <button class="btn-nav" id="btn-next" onclick="navigate(1)">Next</button>
</div>

<div class="container" id="app"></div>

let annotations = {};
let currentIdx = 0;

function init() {
  const saved = localStorage.getItem('ocesq_review_v2');
  if (saved) {
    try {
      const data = JSON.parse(saved);
      annotations = data.annotations || {};
      currentIdx = data.currentIdx || 0;
      document.getElementById('annotator').value = data.annotator || '';
    } catch(e) {}
  }
  document.getElementById('tot').textContent = CASES.length;
  render();
}

function save() {
  localStorage.setItem('ocesq_review_v2', JSON.stringify({
    annotator: document.getElementById('annotator').value,
    annotations: annotations,
    currentIdx: currentIdx,
  }));
  updateStats();
}

function navigate(dir) {
  const newIdx = currentIdx + dir;
  if (newIdx >= 0 && newIdx < CASES.length) {
    // Save current notes before navigating
    const notesEl = document.getElementById('judge-notes');
    if (notesEl && annotations[currentIdx]) {
      annotations[currentIdx].notes = notesEl.value;
    }
    currentIdx = newIdx;
    save();
    render();
    window.scrollTo(0, 0);
  }
}

function judge(value) {
  if (!annotations[currentIdx]) annotations[currentIdx] = {};
  annotations[currentIdx].judgment = value;
  save();
  render();
}

function updateStats() {
  const done = Object.values(annotations).filter(a => a && a.judgment).length;
  document.getElementById('done').textContent = done;
  document.getElementById('cur').textContent = currentIdx + 1;
  document.getElementById('btn-prev').disabled = currentIdx === 0;
  document.getElementById('btn-next').disabled = currentIdx >= CASES.length - 1;
}

function render() {
  updateStats();
  const c = CASES[currentIdx];
  const ann = annotations[currentIdx] || {};
  const statusClass = c.status === 'conflicting' ? 'badge-conflicting' : 'badge-missing';

  // Build natural language summary
  const actionLabel = c.action_label || 'unknown action';
  const contractName = c.contract || 'unknown';
  const contractShort = c.contract_short || '';

  let summaryText = '';
  if (c.status === 'conflicting') {
    const wminus = c.conflicting_paths || [];
    const pathDesc = wminus.length > 0 ? wminus[0] : 'no details available';
    summaryText = `OCESQ flagged this action under the <b>${contractName}</b> contract (${contractShort}). It found <b>conflicting evidence</b>: two or more records appear to contradict each other regarding the target entity. The conflicting path is: "${pathDesc}".`;
  } else {
    const wplus = c.supporting_paths || [];
    const hasSupport = wplus.length > 0;
    const scope = c.absence_scope || {};
    summaryText = `OCESQ flagged this action under the <b>${contractName}</b> contract (${contractShort}). It searched for expected evidence within depth=${scope.depth_bound || '?'} but found <b>none</b>.`;
    if (hasSupport) {
      summaryText += ` Supporting paths were found for other contracts, but none for this one.`;
    }
  }

  // LLM judgment
  const llm = c.llm_judgment || {};
  const llmJudgment = llm.judgment || '?';
  const llmNotes = llm.notes || '';

  // Evidence details (collapsed)
  let evidenceHTML = '<div class="evidence">';
  if ((c.conflicting_paths || []).length > 0) {
    evidenceHTML += `<details><summary>Conflicting paths (${c.conflicting_paths.length})</summary><pre>${c.conflicting_paths.map(p => escapeHTML(p)).join('\n\n')}</pre></details>`;
  }
  if ((c.supporting_paths || []).length > 0) {
    evidenceHTML += `<details><summary>Supporting paths (${c.supporting_paths.length})</summary><pre>${c.supporting_paths.map(p => escapeHTML(p)).join('\n\n')}</pre></details>`;
  }
  if (Object.keys(c.absence_scope || {}).length > 0) {
    evidenceHTML += `<details><summary>Search scope</summary><pre>${escapeHTML(JSON.stringify(c.absence_scope, null, 2))}</pre></details>`;
  }
  evidenceHTML += '</div>';

  // Judge buttons
  const selAgree = ann.judgment === 'agree' ? 'selected-agree' : '';
  const selDisagree = ann.judgment === 'disagree' ? 'selected-disagree' : '';
  const selUnsure = ann.judgment === 'unsure' ? 'selected-unsure' : '';

  const html = `
    <div class="case-card">
      <div class="case-header">
        <span class="case-num">#${currentIdx + 1}</span>
        <span class="badge ${statusClass}">${c.status}</span>
        <span style="font-size:12px;color:#999;">${escapeHTML(c.source)} / ${escapeHTML(c.trace_stem.split('/').pop() || '')}</span>
      </div>

      <div class="meta">
        Contract: <b>${escapeHTML(contractName)}</b> &mdash; ${escapeHTML(contractShort)}
      </div>

      <div class="meta" style="margin-bottom:12px;">
        Action: <b>${escapeHTML(actionLabel)}</b>
      </div>

      <div class="summary-box">
        <div class="title">Case Summary</div>
        <div class="text">${summaryText}</div>
      </div>

      ${evidenceHTML}

      <div class="llm-box">
        <div class="llm-judgment">LLM judged: ${llmJudgment}</div>
        ${llmNotes ? `<div class="llm-notes">${escapeHTML(llmNotes)}</div>` : ''}
        <div style="font-size:11px;color:#999;margin-top:4px;">genuineness: ${llm.genuineness || '?'} | helpfulness: ${llm.helpfulness || '?'}</div>
      </div>

      <div class="judge-section">
        <div class="prompt"><b>Your judgment:</b> Do you agree with the LLM?</div>
        <div class="judge-options">
          <div class="judge-btn ${selAgree}" onclick="judge('agree')">
            Agree with LLM
          </div>
          <div class="judge-btn ${selDisagree}" onclick="judge('disagree')">
            Disagree with LLM
          </div>
          <div class="judge-btn ${selUnsure}" onclick="judge('unsure')">
            Not sure
          </div>
        </div>
        <textarea class="judge-notes" id="judge-notes" placeholder="Optional: why you (dis)agree..." onchange="saveNotes()">${escapeHTML(ann.notes || '')}</textarea>
      </div>
    </div>
  `;

  document.getElementById('app').innerHTML = html;
  document.getElementById('judge-notes').addEventListener('blur', saveNotes);

  // Keyboard shortcuts
  document.onkeydown = function(e) {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    if (e.key === '1') judge('agree');
    if (e.key === '2') judge('disagree');
    if (e.key === '3') judge('unsure');
    if (e.key === 'ArrowRight' || e.key === 'j') navigate(1);
    if (e.key === 'ArrowLeft' || e.key === 'k') navigate(-1);
  };
}

function saveNotes() {
  const el = document.getElementById('judge-notes');
  if (!el) return;
  if (!annotations[currentIdx]) annotations[currentIdx] = {};
  annotations[currentIdx].notes = el.value;
  save();
}

function exportCSV() {
  const name = document.getElementById('annotator').value || 'anonymous';
  let csv = 'case_index,judgment,notes\n';
  CASES.forEach((c, i) => {
    const ann = annotations[i] || {};
    csv += `${i+1},${ann.judgment || ''},"${(ann.notes || '').replace(/"/g, '""')}"\n`;
  });
  const blob = new Blob([csv], {type: 'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ocesq_review_${name}.csv`;
  a.click();
}

function importCSV(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const lines = e.target.result.split('\n').slice(1);
    lines.forEach(line => {
      const m = line.match(/^(\d+),([^,]*),"?(.*?)"?$/);
      if (!m) return;
      const idx = parseInt(m[1]) - 1;
      if (idx >= 0 && idx < CASES.length && m[2]) {
        if (!annotations[idx]) annotations[idx] = {};
        annotations[idx].judgment = m[2];
        annotations[idx].notes = (m[3] || '').replace(/""/g, '"');
      }
    });
    save();
    render();
  };
  reader.readAsText(file);
}

function escapeHTML(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

init();
</script>
</body>
</html>
