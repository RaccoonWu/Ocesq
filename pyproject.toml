[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mandrel"
version = "0.1.0"
description = "Agent execution governance framework — the harness layer for reliable AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Mandrel contributors"},
]
keywords = ["ai", "agent", "harness", "llm", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
yaml = ["PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/mandrel-ai/mandrel"
Repository = "https://github.com/mandrel-ai/mandrel"

[tool.setuptools.packages.find]
include = ["mandrel*"]
