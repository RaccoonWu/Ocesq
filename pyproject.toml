[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ocesq"
version = "0.1.0"
description = "Obligation-constrained evidence subgraph queries for auditing agent execution traces"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "OCESQ contributors"},
]
keywords = ["ai", "agent", "trace", "audit", "provenance", "graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
yaml = ["PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/RaccoonWu/Ocesq"
Repository = "https://github.com/RaccoonWu/Ocesq"

[tool.setuptools.packages.find]
include = ["ocesq*"]
